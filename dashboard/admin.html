<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>量化日报 · 后台</title>
<style>
:root {
  --bg: #f5f5f7; --surface: #ffffff; --surface-2: #f2f2f7; --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.08);
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #8e8e93; --sep: rgba(60,60,67,.14);
  --blue: #007aff; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --gray: #8e8e93;
  --ok-bg: #e6f7ec; --ok-text: #1c7a3e; --warn-bg: #fff4e5; --warn-text: #8a5300; --bad-bg: #ffe9e7; --bad-text: #b3261e;
  --bar: rgba(255,255,255,.78); --shadow: 0 1px 2px rgba(0,0,0,.025), 0 8px 24px rgba(0,0,0,.035);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.16);
    --text: #f5f5f7; --text-2: #aeaeb2; --text-3: #8e8e93; --sep: rgba(84,84,88,.6);
    --blue: #0a84ff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
    --ok-bg: #12301d; --ok-text: #7be39c; --warn-bg: #3a2a0c; --warn-text: #ffd28a; --bad-bg: #3d1713; --bad-text: #ff9c94;
    --bar: rgba(22,22,24,.72); --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--blue); text-decoration: none; }

header { position: sticky; top: 0; z-index: 20; background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--sep); }
.bar { max-width: 1160px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 14px; align-items: center; }
.brand { font-weight: 600; font-size: 17px; white-space: nowrap; }
.brand small { font-weight: 500; font-size: 12px; margin-left: 8px; padding: 2px 8px; border-radius: 99px; background: var(--warn-bg); color: var(--warn-text); }
.spacer { flex: 1; }
nav.tabs { display: flex; gap: 6px; max-width: 1160px; margin: 0 auto; padding: 6px 24px 9px; overflow-x: auto; border-top: .5px solid var(--sep); }
nav.tabs a { color: var(--text-2); padding: 7px 14px; border-radius: 10px; font-size: 13.5px; white-space: nowrap; cursor: pointer; }
nav.tabs a:hover { background: var(--fill-2); color: var(--text); }
nav.tabs a.on { background: var(--fill); color: var(--text); font-weight: 600; }

main { max-width: 1160px; margin: 0 auto; padding: 30px 24px 90px; }
h1 { font-size: 30px; line-height: 1.15; margin: 4px 0 6px; font-weight: 700; letter-spacing: -0.02em; }
.lead { color: var(--text-2); margin: 0 0 22px; font-size: 14px; }
h2 { font-size: 18px; font-weight: 600; margin: 26px 0 10px; }
h2 small { font-size: 12.5px; font-weight: 400; color: var(--text-3); margin-left: 8px; }
.card { background: var(--surface); border: .5px solid var(--sep); border-radius: 18px; box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 14px; }
.card > h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.card > .desc { margin: 0 0 12px; color: var(--text-2); font-size: 13.5px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.tile { background: var(--surface); border: .5px solid var(--sep); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; }
.tile .k { color: var(--text-3); font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile .v { font-size: 22px; font-weight: 650; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--text-2); font-size: 12.5px; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--fill); color: var(--text-2); }
.pill.ok { background: var(--ok-bg); color: var(--ok-text); } .pill.warn { background: var(--warn-bg); color: var(--warn-text); } .pill.bad { background: var(--bad-bg); color: var(--bad-text); }
.btn { border: 0; background: var(--fill); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 13.5px; transition: filter .15s; }
.btn:hover { filter: brightness(.95); } .btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--blue); color: #fff; } .btn.danger { background: var(--bad-bg); color: var(--bad-text); font-weight: 600; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.muted { color: var(--text-2); } .dim { color: var(--text-3); font-size: 12.5px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 6px 10px; border-bottom: .5px solid var(--sep); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: .5px solid var(--sep); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }
.bar-track { height: 8px; background: var(--fill); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.bar-fill { height: 100%; background: var(--blue); border-radius: 99px; transition: width .4s; }
.bar-fill.busy { width: 100%; background: repeating-linear-gradient(45deg, var(--blue) 0 10px, color-mix(in srgb, var(--blue) 60%, transparent) 10px 20px); animation: slide 1s linear infinite; background-size: 28px 28px; }
@keyframes slide { to { background-position: 28px 0; } }
pre.log { margin: 0; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; max-height: 560px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
pre.log.mini { max-height: 90px; font-size: 11.5px; margin-top: 8px; }
input[type=text], select { border: 0; background: var(--fill); border-radius: 9px; padding: 7px 11px; font-size: 14px; outline: none; }
input[type=text]:focus, select:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 35%, transparent); }
.split { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.banner { padding: 11px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; background: var(--bad-bg); color: var(--bad-text); }
.banner.info { background: var(--warn-bg); color: var(--warn-text); }

#toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; }
#toast div { background: #1d1d1f; color: #fff; padding: 9px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: 80vw; }
#toast div.err { background: var(--red); }
.modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); display: grid; place-items: center; padding: 20px; }
.modal { background: var(--surface); border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal h3 { margin: 0 0 8px; font-size: 18px; } .modal p { margin: 0 0 18px; color: var(--text-2); font-size: 14px; white-space: pre-line; }
@media (max-width: 700px) { main { padding: 22px 14px 80px; } .bar, nav.tabs { padding-inline: 14px; } h1 { font-size: 25px; } }
</style>
<link rel="stylesheet" href="/terminal.css">
<script src="/skin.js"></script>
</head>
<body>
<header>
  <div class="bar"><div class="brand">量化日报<small>后台 · 仅本机</small></div><div class="spacer"></div>
    <span class="dim" id="clock"></span><a href="/" class="btn sm" style="color:var(--text)">返回主页面</a></div>
  <nav class="tabs" id="tabs" aria-label="后台导航"></nav>
</header>
<main><div id="banner"></div><div id="view"></div></main>
<div id="toast"></div>
<script src="/admin.js" defer></script>
</body>
</html>
