[pytest]
# 不带参数的 pytest 只收集 tests/，不会碰根目录的 test_talib_demo.py 这类演示脚本
# （它在 import 时就会运行，还依赖不在 requirements.txt 里的 pandas_ta）
testpaths = tests

# 设置 norecursedirs 会覆盖 pytest 的默认值，所以前八项是默认值原样照抄，
# 后四项是本项目额外要跳过的：回收站、行情数据、交接/封存数据、日志
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} _to_delete data handoff logs

# 兜底：即使有人写 pytest . 也跳过这个演示脚本。以后再加演示脚本，请放到 scripts/ 下，或在这里补一条 --ignore
addopts = --ignore=test_talib_demo.py
